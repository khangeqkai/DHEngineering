<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DH Engineering Worker Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
      user-select: none;
    }
    .container {
      -webkit-app-region: no-drag;
      text-align: center;
      width: 320px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 24px;
    }
    label {
      display: block;
      text-align: left;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4a90d9; }
    input::placeholder { color: #555; }
    .error {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 6px;
      min-height: 18px;
      text-align: left;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 16px;
      border: none;
      border-radius: 6px;
      background: #4a90d9;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #3a7bc8; }
    button:disabled { background: #333; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h1>DH Engineering Worker</h1>
    <p class="subtitle">Connect to the server on your network</p>
    <label for="ip">Server IP Address</label>
    <input type="text" id="ip" placeholder="192.168.1.50" autofocus>
    <div class="error" id="error"></div>
    <button id="connect" onclick="connect()">Connect</button>
  </div>
  <script>
    const ipInput = document.getElementById('ip');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('connect');

    ipInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connect();
    });

    function isValidIp(str) {
      const parts = str.split('.');
      if (parts.length !== 4) return false;
      return parts.every(p => {
        const n = Number(p);
        return Number.isInteger(n) && n >= 0 && n <= 255 && p === String(n);
      });
    }

    async function connect() {
      const ip = ipInput.value.trim();
      errorEl.textContent = '';

      if (!ip) {
        errorEl.textContent = 'Please enter an IP address';
        return;
      }
      if (!isValidIp(ip)) {
        errorEl.textContent = 'Invalid IP address format (e.g. 192.168.1.50)';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Connecting...';

      try {
        await window.workerBridge.saveServerIp(ip);
      } catch (err) {
        errorEl.textContent = err.message || 'Failed to save configuration';
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    }
  </script>
</body>
</html>
